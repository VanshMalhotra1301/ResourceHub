<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Skills Seekers Resource Hub 3D</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #030308;
            color: #e5e7eb;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1200px;
            overflow-x: hidden;
        }

        #signup-3d-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            width: 100vw;
            height: 100vh;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 880px;
            background: rgba(10, 11, 20, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 0 80px rgba(168, 85, 247, 0.2), 0 40px 80px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: transform 0.15s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 100px rgba(244, 114, 182, 0.25), 0 45px 90px rgba(0, 0, 0, 0.8);
        }

        .brand {
            width: 42%;
            padding: 60px 44px;
            background: linear-gradient(160deg, rgba(22, 16, 35, 0.7) 0%, rgba(8, 6, 18, 0.95) 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: translateZ(20px);
        }

        .brand-logo {
            width: 86px;
            height: 86px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 22px;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .brand p {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.65;
            margin-bottom: 28px;
        }

        .dots {
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .form-wrap {
            flex: 1;
            padding: 60px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-wrap h3 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .form-wrap .sub {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        .feedback {
            display: none;
            padding: 13px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.45;
            margin-bottom: 18px;
        }

        .feedback.error {
            background: rgba(239, 68, 68, 0.09);
            border: 1px solid rgba(239, 68, 68, 0.28);
            color: #fca5a5;
        }

        .feedback.success {
            background: rgba(34, 197, 94, 0.09);
            border: 1px solid rgba(34, 197, 94, 0.28);
            color: #86efac;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #f9fafb;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .field input::placeholder {
            color: #374151;
        }

        .field input:focus {
            border-color: rgba(168, 85, 247, 0.65);
            background: rgba(168, 85, 247, 0.06);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.13);
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.01em;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #6d28d9 0%, #9333ea 100%);
            box-shadow: 0 0 28px rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .switch {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        .switch a {
            color: #c084fc;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .switch a:hover {
            color: #a855f7;
        }

        @media (max-width: 660px) {
            .card {
                flex-direction: column;
            }

            .brand {
                width: 100%;
                padding: 36px 28px 24px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .form-wrap {
                padding: 28px 24px;
            }
        }
    </style>
</head>

<body>
    <canvas id="signup-3d-canvas"></canvas>
    <div class="card" id="signup-card">

        <div class="brand">
            <div class="brand-logo">
                <img src="/skills.png" alt="Skills Seekers"
                    onerror="this.src='https://ui-avatars.com/api/?name=SS&background=7c3aed&color=fff&size=86&font-size=0.5'">
            </div>
            <h2>Join Skills Seekers<br>Resource Hub</h2>
            <p>Create a free account. Access PYQs, notes, crash courses &amp; more.</p>
            <div class="dots">
                <div class="dot" style="background:#6366f1"></div>
                <div class="dot" style="background:#a855f7"></div>
                <div class="dot" style="background:#fbbf24"></div>
            </div>
        </div>

        <div class="form-wrap">
            <h3>Create Account ✨</h3>
            <p class="sub">Free forever — no credit card needed</p>

            <div id="feedback" class="feedback"></div>

            <form id="signup-form">
                <div class="field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe" autocomplete="name">
                </div>
                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6" placeholder="Minimum 6 characters"
                        autocomplete="new-password">
                </div>
                <button type="submit" id="btn" class="btn">Create Account</button>
            </form>

            <div class="switch">
                Already have an account? <a href="/login">Sign in →</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('signup-form');
        const btn = document.getElementById('btn');
        const feedback = document.getElementById('feedback');

        // If already logged in via sessionStorage, go to home
        if (sessionStorage.getItem('ss_user')) {
            window.location.href = '/home';
        }

        function showMsg(text, type) {
            feedback.textContent = text;
            feedback.className = 'feedback ' + type;
            feedback.style.display = 'block';
        }

        let signupDone = false; // track successful signup so finally block doesn't reset UI

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !email || !password) {
                showMsg('Please fill in all fields.', 'error');
                return;
            }
            if (password.length < 6) {
                showMsg('Password must be at least 6 characters.', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Creating account...';
            feedback.style.display = 'none';
            signupDone = false;

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (data.success) {
                    signupDone = true;
                    if (data.session) {
                        sessionStorage.setItem('ss_user', JSON.stringify(data.user));
                        sessionStorage.setItem('ss_token', data.session.access_token);
                        showMsg('✓ Account created! Redirecting...', 'success');
                        setTimeout(() => { window.location.href = '/home'; }, 700);
                    } else {
                        // Email confirmation required — keep form dimmed
                        showMsg('✓ Account created! Check your email inbox for a confirmation link, then sign in.', 'success');
                        form.style.opacity = '0.4';
                        form.style.pointerEvents = 'none';
                        btn.disabled = true;
                        btn.innerHTML = 'Check your email ✉️';
                    }
                } else {
                    showMsg('❌ ' + (data.error || 'Signup failed. Please try again.'), 'error');
                }
            } catch (err) {
                showMsg('Network error: ' + err.message, 'error');
            } finally {
                // Only re-enable button if signup did NOT succeed
                if (!signupDone) {
                    btn.disabled = false;
                    btn.innerHTML = 'Create Account';
                }
            }
        });

        // 3D Card Tilt Physics
        const card = document.getElementById('signup-card');
        if (card) {
            window.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotX = -((y - centerY) / centerY) * 10;
                const rotY = ((x - centerX) / centerX) * 10;
                card.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.01, 1.01, 1.01)`;
            });
            window.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });
        }

        // 3D WebGL Background Scene
        (function initSignup3D() {
            const canvas = document.getElementById('signup-3d-canvas');
            if (!canvas || typeof THREE === 'undefined') return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 180;

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Particles
            const count = 750;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) {
                pos[i] = (Math.random() - 0.5) * 600;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: 0xa855f7, size: 2.2, transparent: true, opacity: 0.8 });
            const particles = new THREE.Points(geo, mat);
            scene.add(particles);

            // Floating crystal wireframe
            const crystalGeo = new THREE.DodecahedronGeometry(48, 0);
            const crystalMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true, transparent: true, opacity: 0.25 });
            const crystal = new THREE.Mesh(crystalGeo, crystalMat);
            scene.add(crystal);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function anim() {
                requestAnimationFrame(anim);
                particles.rotation.y += 0.0012;
                crystal.rotation.x += 0.002;
                crystal.rotation.y += 0.0025;
                renderer.render(scene, camera);
            }
            anim();
        })();
    </script>
</body>
</html>
